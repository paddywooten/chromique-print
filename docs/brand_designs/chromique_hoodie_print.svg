<svg xmlns="http://www.w3.org/2500/svg" width="12in" height="15in" viewBox="0 0 1200 1500">
  <!-- CHROMIQUE HOODIE CUT & PRINT TEMPLATE (Cutter-ready SVG) -->
  <!-- Features both FRONT (Minimalist Chest) and BACK (Large Statement) cut regions -->
  <!-- Designed for 2-color HTV vinyl cutting (Cricut Venture ready) or DTF transfers -->
  <style>
    .tshirt-text {
      font-family: "Helvetica Neue", "Arial Black", sans-serif;
      font-weight: 900;
      fill: #ffffff; /* White Vinyl Layer */
      letter-spacing: 12px;
      text-anchor: middle;
    }
    .accent-orange {
      fill: #f97316; /* Hermès Safety Orange Vinyl Layer */
    }
    .sub-sans {
      font-family: "Helvetica Neue", "Arial", sans-serif;
      font-weight: bold;
      fill: #f97316;
      letter-spacing: 6px;
      text-anchor: middle;
      font-size: 14px;
    }
    .sub-serif {
      font-family: "Georgia", serif;
      font-style: italic;
      fill: #94a3b8;
      text-anchor: middle;
      font-size: 16px;
      letter-spacing: 2px;
    }
    .guide-box {
      stroke: #334155;
      stroke-width: 2;
      fill: none;
    }
    .title-label {
      font-family: monospace;
      font-size: 14px;
      fill: #64748b;
      font-weight: bold;
    }
  </style>
  
  <rect width="100%" height="100%" fill="none" />

  <!-- =================================--------- -->
  <!-- SECTION A: FRONT PRINT (MINIMALIST CHEST LOGO) -->
  <!-- Sized to exactly 3.5 inches wide, perfect for pocket/center chest -->
  <!-- =================================--------- -->
  <g transform="translate(0, 0)">
    <rect x="50" y="50" width="1100" height="420" class="guide-box" stroke-dasharray="10,10" rx="15" />
    <text x="80" y="90" class="title-label">LAYER A: FRONT CHEST PRINT // 4in x 4in CALIBRATION BOX</text>
    
    <!-- Small Monogram centered -->
    <g transform="translate(600, 260)" scale="0.6">
      <!-- Left Loop (C) -->
      <path d="
        M -20,-70 
        C -85,-70 -130,-20 -130,40
        C -130,100 -85,150 -20,150
        C 45,150 90,100 90,40
        L 50,40
        C 50,80 20,115 -20,115
        C -60,115 -90,80 -90,40
        C -90,0 -60,-35 -20,-35
        C 15,-35 45,-10 50,15
        L 90,15
        C 85,-40 45,-70 -20,-70
        Z" 
        class="accent-orange" />
        
      <!-- Right Loop (Q) -->
      <path d="
        M 70,-40
        C 120,-40 160,-5 160,40
        C 160,85 120,120 70,120
        C 30,120 0,95 -5,60
        L 35,60
        C 40,75 55,90 70,90
        C 95,90 120,70 120,40
        C 120,10 95,-10 70,-10
        C 55,-10 40,5 35,20
        L -5,20
        C 0,-15 30,-40 70,-40
        Z" 
        fill="#ffffff" />
        
      <path d="M 40,-20 L 105,45" stroke="#f97316" stroke-width="8" stroke-linecap="round" />
      <path d="M 65,-20 L 90,5" stroke="#f97316" stroke-width="8" stroke-linecap="round" />
    </g>
  </g>

  <!-- =================================--------- -->
  <!-- SECTION B: BACK PRINT (LARGE STATEMENT GRAPHIC) -->
  <!-- Sized to exactly 11.5 inches wide, perfect for full upper-back statement -->
  <!-- =================================--------- -->
  <g transform="translate(0, 480)">
    <rect x="50" y="50" width="1100" height="920" class="guide-box" stroke-dasharray="10,10" rx="15" />
    <text x="80" y="90" class="title-label">LAYER B: BACK STATEMENT PRINT // 11in x 14in COMPOSITION REGION</text>
    
    <!-- Large Monogram centered -->
    <g transform="translate(600, 420)">
      <!-- Left Loop (C) -->
      <path d="
        M -20,-70 
        C -85,-70 -130,-20 -130,40
        C -130,100 -85,150 -20,150
        C 45,150 90,100 90,40
        L 50,40
        C 50,80 20,115 -20,115
        C -60,115 -90,80 -90,40
        C -90,0 -60,-35 -20,-35
        C 15,-35 45,-10 50,15
        L 90,15
        C 85,-40 45,-70 -20,-70
        Z" 
        class="accent-orange" />
        
      <!-- Right Loop (Q) -->
      <path d="
        M 70,-40
        C 120,-40 160,-5 160,40
        C 160,85 120,120 70,120
        C 30,120 0,95 -5,60
        L 35,60
        C 40,75 55,90 70,90
        C 95,90 120,70 120,40
        C 120,10 95,-10 70,-10
        C 55,-10 40,5 35,20
        L -5,20
        C 0,-15 30,-40 70,-40
        Z" 
        fill="#ffffff" />
        
      <path d="M 40,-20 L 105,45" stroke="#f97316" stroke-width="8" stroke-linecap="round" />
      <path d="M 65,-20 L 90,5" stroke="#f97316" stroke-width="8" stroke-linecap="round" />
    </g>
    
    <!-- Large Typography centered -->
    <g transform="translate(600, 750)">
      <text x="0" y="20" class="tshirt-text" font-size="72">CHROMIQUE</text>
      <line x1="-200" y1="65" x2="200" y2="65" stroke="#1e293b" stroke-width="3" />
      <circle cx="0" cy="65" r="6" class="accent-orange" />
      <text x="0" y="110" class="sub-sans">PREMIUM COLOR &amp; PRECISION CUT</text>
      <text x="0" y="145" class="sub-serif">Accra, Ghana &bull; Series 01</text>
    </g>
  </g>
  
</svg>